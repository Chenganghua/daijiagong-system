<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>后台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
    padding:20px;
}

.container{
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    padding:10px;
    margin:5px;
}

button{
    padding:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>代加工管理后台</h1>

<button onclick="logout()">
退出登录
</button>

<hr>

<input type="date" id="date">

<input type="text" id="worker" placeholder="工人">

<input type="number" id="qty" placeholder="数量">

<input type="number" step="0.01"
id="buyPrice" placeholder="接单单价">

<input type="number" step="0.01"
id="payPrice" placeholder="工人工价">

<input type="number" step="0.01"
id="otherCost" placeholder="其他成本">

<button onclick="addRecord()">
添加记录
</button>

<h2>
总利润：
¥<span id="totalProfit">0</span>
</h2>

<table>

<thead>

<tr>

<th>日期</th>
<th>工人</th>
<th>数量</th>
<th>利润</th>
<th>删除</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

const supabaseUrl =
'https://lewyizyxrwyusggvavyf.supabase.co'

const supabaseKey =
'sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud'

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
)

let currentUser = null

checkUser()

async function checkUser(){

    const {

        data: { user }

    } = await supabase.auth.getUser()

    if(!user){

        window.location.href =
        "login.html"

        return
    }

    currentUser = user

    loadData()
}

async function logout(){

    await supabase.auth.signOut()

    window.location.href =
    "login.html"
}

async function addRecord(){

    const date =
    document.getElementById("date").value

    const worker =
    document.getElementById("worker").value

    const qty =
    Number(
        document.getElementById("qty").value
    )

    const buyPrice =
    Number(
        document.getElementById("buyPrice").value
    )

    const payPrice =
    Number(
        document.getElementById("payPrice").value
    )

    const otherCost =
    Number(
        document.getElementById("otherCost").value || 0
    )

    await supabase
    .from('records')
    .insert([{

        user_id: currentUser.id,

        date,
        worker,
        qty,

        buy_price: buyPrice,

        pay_price: payPrice,

        other_cost: otherCost

    }])

    loadData()
}

async function loadData(){

    const { data } =
    await supabase
    .from('records')
    .select('*')
    .eq('user_id', currentUser.id)

    const table =
    document.getElementById("tableBody")

    table.innerHTML = ""

    let totalProfit = 0

    data.forEach(item => {

        const profit =
        item.qty *
        (item.buy_price - item.pay_price)
        - item.other_cost

        totalProfit += profit

        table.innerHTML += `

        <tr>

        <td>${item.date}</td>

        <td>${item.worker}</td>

        <td>${item.qty}</td>

        <td>${profit.toFixed(2)}</td>

        <td>

        <button onclick="deleteRecord('${item.id}')">

        删除

        </button>

        </td>

        </tr>
        `
    })

    document.getElementById("totalProfit")
    .innerText =
    totalProfit.toFixed(2)
}

async function deleteRecord(id){

    await supabase
    .from('records')
    .delete()
    .eq('id', id)

    loadData()
}

</script>

</body>

</html>
