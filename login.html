<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>登录系统</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

<h2>代加工管理系统</h2>

<input
type="email"
id="email"
placeholder="邮箱">

<input
type="password"
id="password"
placeholder="密码">

<button id="registerBtn">

注册

</button>

<button id="loginBtn">

登录

</button>

</div>

<script>

const url =
'https://lewyizyxrwyusggvavyf.supabase.co'

const key =
'你的 anon key'

const client =
window.supabase.createClient(url,key)

// 注册

document
.getElementById("registerBtn")
.addEventListener("click", async ()=>{

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    const { error } =
    await client.auth.signUp({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        alert("注册成功")
    }
})

// 登录

document
.getElementById("loginBtn")
.addEventListener("click", async ()=>{

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    const { error } =
    await client.auth.signInWithPassword({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        alert("登录成功")
    }
})

</script>

</body>

</html>
