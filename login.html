<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>登录</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

<h2>代加工管理系统</h2>

<input type="email" id="email" placeholder="邮箱">

<input type="password" id="password" placeholder="密码">

<button onclick="register()">
注册
</button>

<button onclick="login()">
登录
</button>

</div>

<script>

const supabaseUrl =
'https://lewyizyxrwyusggvavyf.supabase.co'

const supabaseKey =
'sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud'

const client =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
)

// 注册

async function register(){

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    const { error } =
    await client.auth.signUp({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        alert("注册成功")
    }
}

// 登录

async function login(){

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    const { error } =
    await client.auth.signInWithPassword({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        window.location.href =
        "dashboard.html"
    }
}

</script>

</body>

</html>
