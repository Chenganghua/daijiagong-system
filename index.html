<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>代加工管理系统</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    padding:10px;
    margin:5px;
}

button{
    padding:10px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#eee;
}

.stat{
    font-size:22px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>代加工管理系统</h1>

<hr>

<input type="date" id="date">

<input
type="text"
id="worker"
placeholder="工人名字">

<input
type="number"
id="qty"
placeholder="数量">

<input
type="number"
step="0.01"
id="buyPrice"
placeholder="接单单价">

<input
type="number"
step="0.01"
id="payPrice"
placeholder="工人工价">

<input
type="number"
step="0.01"
id="otherCost"
placeholder="其他成本">

<button onclick="addRecord()">

添加记录

</button>

<h2 class="stat">

总利润：
¥<span id="totalProfit">0</span>

</h2>

<table>

<thead>

<tr>

<th>日期</th>

<th>工人</th>

<th>数量</th>

<th>工人工资</th>

<th>利润</th>

<th>删除</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

const url =
'https://lewyizyxrwyusggvavyf.supabase.co'

const key =
'sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud'

const client =
window.supabase.createClient(url,key)

// 页面加载

loadData()

// 添加记录

async function addRecord(){

    const date =
    document.getElementById("date").value

    const worker =
    document.getElementById("worker").value

    const qty =
    Number(
        document.getElementById("qty").value
    )

    const buyPrice =
    Number(
        document.getElementById("buyPrice").value
    )

    const payPrice =
    Number(
        document.getElementById("payPrice").value
    )

    const otherCost =
    Number(
        document.getElementById("otherCost").value || 0
    )

    await client
    .from('records')
    .insert([{

        date,
        worker,
        qty,

        buy_price: buyPrice,

        pay_price: payPrice,

        other_cost: otherCost

    }])

    loadData()
}

// 加载数据

async function loadData(){

    const { data } =
    await client
    .from('records')
    .select('*')
    .order('id',{ascending:false})

    const table =
    document.getElementById("tableBody")

    table.innerHTML = ""

    let totalProfit = 0

    data.forEach(item=>{

        const salary =
        item.qty * item.pay_price

        const income =
        item.qty * item.buy_price

        const profit =
        income - salary - item.other_cost

        totalProfit += profit

        table.innerHTML += `

        <tr>

        <td>${item.date}</td>

        <td>${item.worker}</td>

        <td>${item.qty}</td>

        <td>¥${salary.toFixed(2)}</td>

        <td>¥${profit.toFixed(2)}</td>

        <td>

        <button onclick="deleteRecord('${item.id}')">

        删除

        </button>

        </td>

        </tr>

        `
    })

    document.getElementById("totalProfit")
    .innerText =
    totalProfit.toFixed(2)
}

// 删除

async function deleteRecord(id){

    await client
    .from('records')
    .delete()
    .eq('id',id)

    loadData()
}

</script>

</body>

</html>
