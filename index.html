<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代加工记账管理</title>
    <style>
        :root {
            --blue: #007AFF;
            --red: #FF3B30;
            --green: #34C759;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --gray1: #F2F2F7;
            --gray3: #C7C7CC;
            --gray4: #8E8E93;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #000;
            padding: 20px 16px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 20px; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        input {
            flex: 1 1 100px;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            background: var(--gray1);
            font-size: 15px;
            outline: none;
        }
        input:focus { background: #E8E8ED; box-shadow: 0 0 0 2px rgba(0,122,255,0.25); }
        button {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { opacity: 0.7; transform: scale(0.98); }
        .profit { display: flex; justify-content: space-between; align-items: baseline; }
        .profit span:first-child { font-size: 17px; font-weight: 500; }
        .profit span:last-child { font-size: 32px; font-weight: 700; color: var(--green); }
        .list-item {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            background: var(--card);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 8px;
            gap: 8px;
            font-size: 14px;
        }
        .list-item div { flex: 1; text-align: center; }
        .del-btn {
            background: rgba(255,59,48,0.1);
            color: var(--red);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .empty { text-align: center; color: var(--gray4); padding: 30px; }
        @media (max-width: 480px) {
            .list-item { flex-direction: column; align-items: flex-start; }
            .list-item div { width: 100%; text-align: left; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>代加工记账管理</h1>

    <!-- 添加记录 -->
    <div class="card">
        <div class="card-title">新记录</div>
        <div class="input-row">
            <input type="date" id="date">
            <input type="text" id="worker" placeholder="工人姓名">
        </div>
        <div class="input-row">
            <input type="number" id="qty" placeholder="数量" step="1">
            <input type="number" id="buyPrice" placeholder="接单单价" step="0.01">
        </div>
        <div class="input-row">
            <input type="number" id="payPrice" placeholder="工人工价" step="0.01">
            <input type="number" id="otherCost" placeholder="其他成本" step="0.01" value="0">
        </div>
        <button onclick="addRecord()">添加记录</button>
    </div>

    <!-- 利润显示 -->
    <div class="card">
        <div class="profit">
            <span>总利润</span>
            <span id="totalProfit">¥0</span>
        </div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
        <div class="card-title">历史记录</div>
        <div id="recordList">
            <div class="empty">暂无记录</div>
        </div>
    </div>
</div>

<script>
    // ==================== 配置 ====================
    const BASE = "https://lewyizyxrwyusggvavyf.supabase.co/rest/v1/records"
    const KEY  = "sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud"

    // 页面加载时获取数据
    loadData()

    // ==================== 增 ====================
    async function addRecord() {
        const date   = document.getElementById('date').value
        const worker = document.getElementById('worker').value.trim()
        const qty    = Number(document.getElementById('qty').value)
        const buyP   = Number(document.getElementById('buyPrice').value)
        const payP   = Number(document.getElementById('payPrice').value)
        const other  = Number(document.getElementById('otherCost').value) || 0

        if (!date || !worker || !qty) return alert('请填写日期、工人和数量')

        const res = await fetch(BASE, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': KEY,
                'Authorization': `Bearer ${KEY}`
            },
            body: JSON.stringify({
                date,
                worker,
                qty,
                buy_price: buyP,
                pay_price: payP,
                other_cost: other
            })
        })

        if (!res.ok) {
            const err = await res.json()
            return alert('添加失败：' + err.message)
        }

        // 清空部分输入
        document.getElementById('qty').value = ''
        document.getElementById('buyPrice').value = ''
        document.getElementById('payPrice').value = ''
        document.getElementById('otherCost').value = '0'
        loadData()
    }

    // ==================== 查 ====================
    async function loadData() {
        const res = await fetch(`${BASE}?select=*&order=id.desc`, {
            headers: {
                'apikey': KEY,
                'Authorization': `Bearer ${KEY}`
            }
        })

        const list = document.getElementById('recordList')
        if (!res.ok) {
            list.innerHTML = '<div class="empty">加载失败</div>'
            return
        }

        const data = await res.json()
        if (!data || data.length === 0) {
            list.innerHTML = '<div class="empty">暂无记录</div>'
            document.getElementById('totalProfit').innerText = '¥0'
            return
        }

        let total = 0
        list.innerHTML = ''
        data.forEach(item => {
            const salary = item.qty * item.pay_price
            const income = item.qty * item.buy_price
            const profit = income - salary - (item.other_cost || 0)
            total += profit

            const div = document.createElement('div')
            div.className = 'list-item'
            div.innerHTML = `
                <div><strong>${item.date}</strong></div>
                <div>${item.worker}</div>
                <div>${item.qty} 件</div>
                <div>¥${salary.toFixed(2)}</div>
                <div style="color:${profit>=0?'var(--green)':'var(--red)'}">¥${profit.toFixed(2)}</div>
                <button class="del-btn" onclick="deleteRecord('${item.id}')">删除</button>
            `
            list.appendChild(div)
        })

        document.getElementById('totalProfit').innerText = '¥' + total.toFixed(2)
    }

    // ==================== 删 ====================
    async function deleteRecord(id) {
        if (!confirm('确定删除？')) return

        const res = await fetch(`${BASE}?id=eq.${id}`, {
            method: 'DELETE',
            headers: {
                'apikey': KEY,
                'Authorization': `Bearer ${KEY}`
            }
        })

        if (!res.ok) return alert('删除失败')
        loadData()
    }
</script>
</body>
</html>
