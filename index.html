<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代加工管理系统</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    padding:10px;
    margin:5px;
}

button{
    padding:10px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#eee;
}

.stat{
    font-size:20px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>代加工管理系统（云同步版）</h1>

<hr>

<input type="date" id="date">
<input type="text" id="worker" placeholder="工人">
<input type="number" id="qty" placeholder="数量">
<input type="number" step="0.01" id="buyPrice" placeholder="接单单价">
<input type="number" step="0.01" id="payPrice" placeholder="工人工价">
<input type="number" step="0.01" id="otherCost" placeholder="其他成本">

<button onclick="addRecord()">添加记录</button>

<h2 class="stat">
总利润：¥<span id="totalProfit">0</span>
</h2>

<table>
<thead>
<tr>
<th>日期</th>
<th>工人</th>
<th>数量</th>
<th>工人工资</th>
<th>利润</th>
<th>删除</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

</div>

<script>

const url = "https://lewyizyxrwyusggvavyf.supabase.co"
const key = "sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud"

const client = window.supabase.createClient(url, key)

loadData()

// 添加记录
async function addRecord(){

    const date = document.getElementById("date").value
    const worker = document.getElementById("worker").value
    const qty = Number(document.getElementById("qty").value)
    const buyPrice = Number(document.getElementById("buyPrice").value)
    const payPrice = Number(document.getElementById("payPrice").value)
    const otherCost = Number(document.getElementById("otherCost").value || 0)

    if(!date || !worker || !qty){
        alert("请填写完整数据")
        return
    }

    const { error } = await client
        .from('records')
        .insert([{
            date: date,
            worker: worker,
            qty: qty,
            buy_price: buyPrice,
            pay_price: payPrice,
            other_cost: otherCost
        }])

    if(error){
        alert("插入失败：" + error.message)
        return
    }

    loadData()
}

// 读取数据
async function loadData(){

    const { data, error } = await client
        .from('records')
        .select('*')
        .order('id', { ascending: false })

    if(error){
        console.log(error)
        return
    }

    const table = document.getElementById("tableBody")
    table.innerHTML = ""

    let total = 0

    data.forEach(item => {

        const salary = item.qty * item.pay_price
        const income = item.qty * item.buy_price
        const profit = income - salary - item.other_cost

        total += profit

        table.innerHTML += `
        <tr>
            <td>${item.date || ""}</td>
            <td>${item.worker || ""}</td>
            <td>${item.qty || 0}</td>
            <td>${salary.toFixed(2)}</td>
            <td>${profit.toFixed(2)}</td>
            <td>
                <button onclick="deleteRecord('${item.id}')">删除</button>
            </td>
        </tr>
        `
    })

    document.getElementById("totalProfit").innerText = total.toFixed(2)
}

// 删除
async function deleteRecord(id){

    const { error } = await client
        .from('records')
        .delete()
        .eq('id', id)

    if(error){
        alert(error.message)
        return
    }

    loadData()
}

</script>

</body>
</html>
