
<!DOCTYPE html>
<html lang="zh">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代加工云管理系统</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    padding:20px;
}
.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}
input,button{
    padding:8px;
    margin:5px;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{
    background:#eee;
}
.card{
    margin-top:20px;
    background:#fafafa;
    padding:15px;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="container">

<h1>代加工云管理系统</h1>

<div class="card">
<h2>登录 / 注册</h2>

<input type="email" id="email" placeholder="邮箱">
<input type="password" id="password" placeholder="密码">

<button onclick="register()">注册</button>
<button onclick="login()">登录</button>
<button onclick="logout()">退出</button>

<p id="userInfo">未登录</p>
</div>

<div class="card">
<h2>添加记录</h2>

<input type="date" id="date">
<input type="text" id="worker" placeholder="做货人">
<input type="number" id="qty" placeholder="数量">
<input type="number" step="0.01" id="buyPrice" placeholder="接单单价">
<input type="number" step="0.01" id="payPrice" placeholder="工人工价">
<input type="number" step="0.01" id="otherCost" placeholder="其他成本">

<button onclick="addRecord()">添加记录</button>
</div>

<table>
<thead>
<tr>
<th>日期</th>
<th>做货人</th>
<th>数量</th>
<th>工人工资</th>
<th>利润</th>
<th>删除</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<div class="card">
<h2>每天利润统计</h2>

<table>
<thead>
<tr>
<th>日期</th>
<th>利润</th>
</tr>
</thead>

<tbody id="dailyTable"></tbody>
</table>
</div>

<div class="card">
<h2>总统计</h2>

<p>总利润：¥<span id="totalProfit">0.00</span></p>

</div>

</div>

<script>

    const supabaseUrl = 'https://lewyizyxrwyusggvavyf.supabase.co'

const supabaseKey = 'sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud'

const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
)
// ============================
// Firebase配置（需要你自己填）
// ============================

const firebaseConfig = {
  apiKey: "请填写",
  authDomain: "请填写",
  projectId: "请填写",
  storageBucket: "请填写",
  messagingSenderId: "请填写",
  appId: "请填写"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// ============================
// 注册
// ============================

function register(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email,password)
    .then(()=>{
        alert("注册成功");
    })
    .catch(err=>{
        alert(err.message);
    });
}

// ============================
// 登录
// ============================

function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email,password)
    .then(()=>{
        alert("登录成功");
    })
    .catch(err=>{
        alert(err.message);
    });
}

// ============================
// 退出
// ============================

function logout(){
    auth.signOut();
}

// ============================
// 登录状态监听
// ============================

auth.onAuthStateChanged(user=>{

    if(user){

        currentUser = user;

        document.getElementById("userInfo").innerText =
        "当前账号：" + user.email;

        loadData();

    }else{

        currentUser = null;

        document.getElementById("userInfo").innerText =
        "未登录";

        document.getElementById("tableBody").innerHTML = "";
    }
});

// ============================
// 添加记录
// ============================

async function addRecord(){

    if(!currentUser){
        alert("请先登录");
        return;
    }

    const data = {

        uid: currentUser.uid,

        date: document.getElementById("date").value,

        worker: document.getElementById("worker").value,

        qty: Number(document.getElementById("qty").value),

        buyPrice: Number(document.getElementById("buyPrice").value),

        payPrice: Number(document.getElementById("payPrice").value),

        otherCost: Number(document.getElementById("otherCost").value || 0)

    };

    await db.collection("records").add(data);

    loadData();
}

// ============================
// 加载数据（云端同步）
// ============================

async function loadData(){

    if(!currentUser) return;

    const snapshot = await db.collection("records")
    .where("uid","==",currentUser.uid)
    .get();

    const table = document.getElementById("tableBody");
    const dailyTable = document.getElementById("dailyTable");

    table.innerHTML = "";
    dailyTable.innerHTML = "";

    let totalProfit = 0;

    let dailyStats = {};

    snapshot.forEach(doc=>{

        const r = doc.data();

        const salary = r.qty * r.payPrice;

        const income = r.qty * r.buyPrice;

        const profit = income - salary - r.otherCost;

        totalProfit += profit;

        if(!dailyStats[r.date]){
            dailyStats[r.date] = 0;
        }

        dailyStats[r.date] += profit;

        table.innerHTML += `
        <tr>
            <td>${r.date}</td>
            <td>${r.worker}</td>
            <td>${r.qty}</td>
            <td>${salary.toFixed(2)}</td>
            <td>${profit.toFixed(2)}</td>
            <td>
                <button onclick="deleteRecord('${doc.id}')">
                删除
                </button>
            </td>
        </tr>
        `;
    });

    for(let day in dailyStats){

        dailyTable.innerHTML += `
        <tr>
            <td>${day}</td>
            <td>${dailyStats[day].toFixed(2)}</td>
        </tr>
        `;
    }

    document.getElementById("totalProfit").innerText =
    totalProfit.toFixed(2);
}

// ============================
// 删除记录
// ============================

async function deleteRecord(id){

    await db.collection("records").doc(id).delete();

    loadData();
}

</script>

</body>
</html>
