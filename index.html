<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代加工记账管理</title>
    <style>
        :root {
            --blue: #007AFF;
            --red: #FF3B30;
            --green: #34C759;
            --yellow: #FF9500;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --gray1: #F2F2F7;
            --gray4: #8E8E93;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #000;
            padding: 20px 16px;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 20px; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        input, select, textarea {
            flex: 1 1 100px;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            background: var(--gray1);
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }
        textarea {
            flex: 1 1 100%;
            min-height: 70px;
            resize: vertical;
        }
        input::placeholder, textarea::placeholder { color: var(--gray4); }
        input:focus, select:focus, textarea:focus {
            background: #E8E8ED;
            box-shadow: 0 0 0 2px rgba(0,122,255,0.25);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { opacity: 0.7; transform: scale(0.98); }
        .profit { display: flex; justify-content: space-between; align-items: baseline; }
        .profit span:first-child { font-size: 17px; font-weight: 500; }
        .profit span:last-child { font-size: 32px; font-weight: 700; color: var(--green); }
        .list-item {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            background: var(--card);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 8px;
            gap: 8px;
            font-size: 14px;
        }
        .list-item div { flex: 1; text-align: center; }
        .editable {
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .editable:hover { color: var(--blue); }
        .del-btn {
            background: rgba(255,59,48,0.1);
            color: var(--red);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .return-btn {
            background: rgba(0,122,255,0.1);
            color: var(--blue);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .empty { text-align: center; color: var(--gray4); padding: 30px; }
        .filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-row select { width: auto; flex: 0 0 auto; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-yellow { background: #FFF3D6; color: var(--yellow); }
        .badge-green { background: #D4F5DD; color: var(--green); }
        .note-cell {
            flex: 2 !important;
            text-align: left !important;
            color: #666;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 15px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 代加工记账管理</h1>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 新记录表单 -->
    <div class="card">
        <div class="card-title">新发放记录</div>
        <div class="input-row">
            <input type="date" id="date">
            <input type="text" id="model" placeholder="型号">
            <input type="text" id="worker" placeholder="工人姓名">
        </div>
        <div class="input-row">
            <input type="number" id="sentQty" placeholder="发出数量" step="1">
            <input type="number" id="returnedQty" placeholder="本次收回数量" step="1">
        </div>
        <div class="input-row">
            <input type="number" id="buyPrice" placeholder="接单单价" step="0.01">
            <input type="number" id="payPrice" placeholder="工人工价" step="0.01">
        </div>
        <div class="input-row">
            <input type="number" id="otherCost" placeholder="其他成本" step="0.01">
        </div>
        <div class="input-row">
            <textarea id="note" placeholder="备注（材料、颜色、特殊要求等）"></textarea>
        </div>
        <button onclick="addRecord()">添加记录</button>
    </div>

    <!-- 利润总览 -->
    <div class="card">
        <div class="profit">
            <span>总利润（按已收回）</span>
            <span id="totalProfit">¥0</span>
        </div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
        <div class="filter-row">
            <span class="card-title" style="margin-bottom:0;">历史记录</span>
            <select id="workerFilter" onchange="loadData()">
                <option value="">所有工人</option>
            </select>
            <select id="modelFilter" onchange="loadData()">
                <option value="">所有型号</option>
            </select>
        </div>
        <div id="recordList">
            <div class="empty">暂无记录</div>
        </div>
    </div>
</div>

<script>
    const BASE = "https://lewyizyxrwyusggvavyf.supabase.co/rest/v1/records"
    const KEY  = "sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud"

    // 自动填充今天日期
    document.getElementById('date').value = new Date().toISOString().split('T')[0]

    loadData()

    // Toast 提示
    function showToast(msg) {
        const toast = document.getElementById('toast')
        toast.textContent = msg
        toast.classList.add('show')
        setTimeout(() => toast.classList.remove('show'), 2000)
    }

    async function addRecord() {
        const date      = document.getElementById('date').value
        const model     = document.getElementById('model').value.trim()
        const worker    = document.getElementById('worker').value.trim()
        const sentQty   = Number(document.getElementById('sentQty').value)
        const returnedQty = Number(document.getElementById('returnedQty').value) || 0
        const buyP      = Number(document.getElementById('buyPrice').value)
        const payP      = Number(document.getElementById('payPrice').value)
        const other     = Number(document.getElementById('otherCost').value) || 0
        const note      = document.getElementById('note').value.trim()

        if (!date || !worker || !sentQty) return alert('请填写日期、工人和发出数量')

        try {
            const res = await fetch(BASE, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': KEY,
                    'Authorization': `Bearer ${KEY}`
                },
                body: JSON.stringify({
                    date,
                    model: model || null,
                    worker,
                    sent_qty: sentQty,
                    returned_qty: returnedQty,
                    buy_price: buyP,
                    pay_price: payP,
                    other_cost: other,
                    note: note || null
                })
            })
            if (!res.ok) {
                const err = await res.json()
                throw new Error(err.message)
            }
            // 清空表单（保留日期）
            document.getElementById('model').value = ''
            document.getElementById('worker').value = ''
            document.getElementById('sentQty').value = ''
            document.getElementById('returnedQty').value = ''
            document.getElementById('buyPrice').value = ''
            document.getElementById('payPrice').value = ''
            document.getElementById('otherCost').value = ''
            document.getElementById('note').value = ''
            showToast('✅ 记录添加成功')
            loadData()
        } catch (err) {
            alert('添加失败：' + err.message)
        }
    }

    async function loadData() {
        const workerFilter = document.getElementById('workerFilter').value
        const modelFilter  = document.getElementById('modelFilter').value
        let url = `${BASE}?select=*&order=id.desc`
        if (workerFilter) url += `&worker=eq.${encodeURIComponent(workerFilter)}`
        if (modelFilter) url += `&model=eq.${encodeURIComponent(modelFilter)}`

        const list = document.getElementById('recordList')
        try {
            const res = await fetch(url, {
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
            })
            if (!res.ok) {
                list.innerHTML = '<div class="empty">加载失败</div>'
                return
            }
            const data = await res.json()
            if (!data || data.length === 0) {
                list.innerHTML = '<div class="empty">暂无记录</div>'
                document.getElementById('totalProfit').innerText = '¥0'
                updateFilters(data)
                return
            }

            let total = 0
            list.innerHTML = ''
            const workerSet = new Set()
            const modelSet = new Set()
            data.forEach(item => {
                if (item.worker) workerSet.add(item.worker)
                if (item.model) modelSet.add(item.model)
                const sent = Number(item.sent_qty) || 0
                const returned = Number(item.returned_qty) || 0
                const unpaid = sent - returned
                const profit = (returned * item.buy_price) - (returned * item.pay_price) - (item.other_cost || 0)
                total += profit

                const profitColor = profit >= 0 ? 'var(--green)' : 'var(--red)'

                const div = document.createElement('div')
                div.className = 'list-item'
                div.innerHTML = `
                    <div><strong>${item.date}</strong></div>
                    <div>${item.model || '-'}</div>
                    <div>${item.worker}</div>
                    <div class="editable" onclick="editSentQty('${item.id}', ${sent})">发：${sent}</div>
                    <div class="editable" onclick="editReturnedQty('${item.id}', ${returned})">收：${returned}</div>
                    <div style="color:${unpaid>0?'var(--yellow)':'var(--green)'};font-weight:600;">
                        未收：${unpaid}
                        ${unpaid > 0 ? '<span class="badge badge-yellow">进行中</span>' : '<span class="badge badge-green">已收完</span>'}
                    </div>
                    <div style="color:${profitColor};font-weight:600;">利润：¥${profit.toFixed(2)}</div>
                    ${item.note ? `<div class="note-cell editable" onclick="editNote('${item.id}', '${escapeHtml(item.note)}')">📝 ${escapeHtml(item.note)}</div>` : ''}
                    <button class="return-btn" onclick="addReturn('${item.id}', ${returned})">+收回</button>
                    <button class="del-btn" onclick="deleteRecord('${item.id}')">删除</button>
                `
                list.appendChild(div)
            })

            // 总利润颜色
            const totalEl = document.getElementById('totalProfit')
            totalEl.innerText = '¥' + total.toFixed(2)
            totalEl.style.color = total >= 0 ? 'var(--green)' : 'var(--red)'

            updateFilters(data)
        } catch (err) {
            list.innerHTML = '<div class="empty">网络错误，请检查连接</div>'
        }
    }

    // HTML 转义，防止 XSS
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;')
    }

    // 编辑发出数量
    async function editSentQty(id, currentValue) {
        const newValue = prompt('修改发出数量', currentValue)
        if (newValue === null || newValue === '') return
        const num = Number(newValue)
        if (isNaN(num) || num < 0) return alert('请输入有效数字')
        await patchRecord(id, { sent_qty: num })
    }

    // 编辑收回数量
    async function editReturnedQty(id, currentValue) {
        const newValue = prompt('修改收回数量', currentValue)
        if (newValue === null || newValue === '') return
        const num = Number(newValue)
        if (isNaN(num) || num < 0) return alert('请输入有效数字')
        await patchRecord(id, { returned_qty: num })
    }

    // 编辑备注
    async function editNote(id, currentNote) {
        const newNote = prompt('修改备注', currentNote)
        if (newNote === null) return
        await patchRecord(id, { note: newNote.trim() || null })
    }

    // 通用 PATCH 更新
    async function patchRecord(id, body) {
        try {
            const res = await fetch(`${BASE}?id=eq.${id}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': KEY,
                    'Authorization': `Bearer ${KEY}`
                },
                body: JSON.stringify(body)
            })
            if (!res.ok) throw new Error('更新失败')
            showToast('✅ 修改已保存')
            loadData()
        } catch (err) {
            alert('修改失败：' + err.message)
        }
    }

    // 追加收回
    async function addReturn(id, currentReturned) {
        const addQty = prompt('请输入本次追加收回的数量：', '0')
        if (!addQty || isNaN(addQty) || Number(addQty) <= 0) return
        const newReturned = currentReturned + Number(addQty)
        await patchRecord(id, { returned_qty: newReturned })
    }

    // 删除
    async function deleteRecord(id) {
        if (!confirm('确定删除这条记录吗？此操作不可恢复。')) return
        try {
            const res = await fetch(`${BASE}?id=eq.${id}`, {
                method: 'DELETE',
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
            })
            if (!res.ok) throw new Error('删除失败')
            showToast('🗑️ 记录已删除')
            loadData()
        } catch (err) {
            alert('删除失败：' + err.message)
        }
    }

    // 更新筛选下拉框
    function updateFilters(data) {
        const workerSelect = document.getElementById('workerFilter')
        const currentWorker = workerSelect.value
        const workers = [...new Set((data || []).map(item => item.worker).filter(Boolean))]
        workerSelect.innerHTML = '<option value="">所有工人</option>'
        workers.forEach(w => {
            workerSelect.innerHTML += `<option value="${w}" ${w === currentWorker ? 'selected' : ''}>${w}</option>`
        })

        const modelSelect = document.getElementById('modelFilter')
        const currentModel = modelSelect.value
        const models = [...new Set((data || []).map(item => item.model).filter(Boolean))]
        modelSelect.innerHTML = '<option value="">所有型号</option>'
        models.forEach(m => {
            modelSelect.innerHTML += `<option value="${m}" ${m === currentModel ? 'selected' : ''}>${m}</option>`
        })
    }
</script>
</body>
</html>
