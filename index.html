<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>代加工管理系统</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h1,h2{
    margin-top:0;
}

.card{
    background:#fafafa;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

input{
    padding:10px;
    margin:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    background:#333;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    opacity:0.8;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#eee;
}

.stat{
    font-size:20px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>代加工管理系统</h1>

<div class="card">

<h2>登录 / 注册</h2>

<input type="email" id="email" placeholder="邮箱">

<input type="password" id="password" placeholder="密码">

<button onclick="register()">注册</button>

<button onclick="login()">登录</button>

<button onclick="logout()">退出</button>

<p id="userInfo">未登录</p>

</div>

<div class="card">

<h2>添加记录</h2>

<input type="date" id="date">

<input type="text" id="worker" placeholder="工人名字">

<input type="number" id="qty" placeholder="数量">

<input type="number" step="0.01" id="buyPrice" placeholder="接单单价">

<input type="number" step="0.01" id="payPrice" placeholder="工人工价">

<input type="number" step="0.01" id="otherCost" placeholder="其他成本">

<button onclick="addRecord()">添加记录</button>

</div>

<div class="card">

<h2>利润统计</h2>

<p class="stat">
总利润：¥<span id="totalProfit">0.00</span>
</p>

</div>

<table>

<thead>

<tr>

<th>日期</th>

<th>工人</th>

<th>数量</th>

<th>工人工资</th>

<th>利润</th>

<th>删除</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

// ======================
// Supabase 配置
// ======================

const supabaseUrl =
'https://lewyizyxrwyusggvavyf.supabase.co'

const supabaseKey =
'sb_publishable_mxl0MC99IxQOK_kLOP2IWg_symDykud'

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
)

let currentUser = null

// ======================
// 注册
// ======================

async function register(){

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    if(!email || !password){

        alert("请输入邮箱和密码")

        return
    }

    const { error } =
    await supabase.auth.signUp({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        alert("注册成功")
    }
}

// ======================
// 登录
// ======================

async function login(){

    const email =
    document.getElementById("email").value

    const password =
    document.getElementById("password").value

    const { error } =
    await supabase.auth.signInWithPassword({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        alert("登录成功")

        checkUser()
    }
}

// ======================
// 退出
// ======================

async function logout(){

    await supabase.auth.signOut()

    location.reload()
}

// ======================
// 检查用户
// ======================

async function checkUser(){

    const {

        data: { user }

    } = await supabase.auth.getUser()

    if(user){

        currentUser = user

        document.getElementById("userInfo")
        .innerText =
        "当前用户：" + user.email

        loadData()
    }
}

// ======================
// 添加记录
// ======================

async function addRecord(){

    if(!currentUser){

        alert("请先登录")

        return
    }

    const date =
    document.getElementById("date").value

    const worker =
    document.getElementById("worker").value

    const qty =
    Number(
        document.getElementById("qty").value
    )

    const buyPrice =
    Number(
        document.getElementById("buyPrice").value
    )

    const payPrice =
    Number(
        document.getElementById("payPrice").value
    )

    const otherCost =
    Number(
        document.getElementById("otherCost").value || 0
    )

    const { error } =
    await supabase
    .from('records')
    .insert([{

        user_id: currentUser.id,

        date: date,

        worker: worker,

        qty: qty,

        buy_price: buyPrice,

        pay_price: payPrice,

        other_cost: otherCost

    }])

    if(error){

        alert(error.message)

    }else{

        loadData()
    }
}

// ======================
// 读取数据
// ======================

async function loadData(){

    const { data, error } =
    await supabase
    .from('records')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('date', {

        ascending:false

    })

    if(error){

        alert(error.message)

        return
    }

    const table =
    document.getElementById("tableBody")

    table.innerHTML = ""

    let totalProfit = 0

    data.forEach(record => {

        const salary =
        record.qty * record.pay_price

        const income =
        record.qty * record.buy_price

        const profit =
        income - salary - record.other_cost

        totalProfit += profit

        table.innerHTML += `

        <tr>

        <td>${record.date}</td>

        <td>${record.worker}</td>

        <td>${record.qty}</td>

        <td>¥${salary.toFixed(2)}</td>

        <td>¥${profit.toFixed(2)}</td>

        <td>

        <button onclick="deleteRecord('${record.id}')">

        删除

        </button>

        </td>

        </tr>

        `
    })

    document.getElementById("totalProfit")
    .innerText =
    totalProfit.toFixed(2)
}

// ======================
// 删除记录
// ======================

async function deleteRecord(id){

    await supabase
    .from('records')
    .delete()
    .eq('id', id)

    loadData()
}

// ======================
// 页面加载自动检查登录
// ======================

checkUser()

</script>

</body>

</html>
